# ============================================================
# E2E Test Pipeline — SauceDemo Playwright Framework
# ============================================================
# GitHub Actions lee este archivo automáticamente cuando detecta
# un evento (push, pull_request) en las ramas configuradas.
# Crea un "runner" (máquina virtual Linux en los servidores de
# GitHub), clona el repo ahí, y ejecuta los steps en orden.
# ============================================================

name: E2E Tests with Docker

# ------------------------------------------------------------
# Eventos que disparan el pipeline.
# push: cada vez que subes código a main o develop.
# pull_request: cada vez que alguien abre o actualiza un PR
# apuntando a main o develop. Así los tests corren ANTES de
# mergear, no después.
# ------------------------------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ------------------------------------------------------------
  # JOB 1 — Ejecutar tests por browser en paralelo.
  # La matrix levanta 3 VMs simultáneas, una por browser.
  # Cada una construye la imagen, corre su proyecto y sube
  # sus allure-results como artifact independiente.
  # fail-fast: false garantiza que si un browser falla, los
  # otros dos siguen corriendo igual.
  # ------------------------------------------------------------
  test:
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # ----------------------------------------------------------
      # PASO 1 — Clonar el repositorio
      # La VM de GitHub arranca vacía. Este paso descarga el código
      # del repo (la rama que disparó el evento) dentro de la VM.
      # Sin este paso, los siguientes no tienen nada con qué trabajar.
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PASO 2 — Construir la imagen Docker
      # Lee el Dockerfile en la raíz del repo y construye la imagen
      # con el tag "saucedemo-playwright".
      # La imagen incluye Node, Playwright, browsers y todas las
      # dependencias del sistema — no hay que instalar nada por separado.
      # En cada run se construye desde cero usando el código recién
      # clonado. El cache de capas de Docker acelera los builds cuando
      # solo cambia el código y no las dependencias.
      # ----------------------------------------------------------
      - name: Build Docker image
        run: docker build -t saucedemo-playwright .

      # ----------------------------------------------------------
      # PASO 3 — Ejecutar los tests dentro del contenedor
      # Corre el proyecto del browser correspondiente dentro de la
      # imagen recién construida.
      # -v monta carpetas del runner dentro del contenedor para que
      # los reportes generados queden disponibles en el runner y
      # puedan subirse como artifacts en los pasos siguientes.
      # --rm elimina el contenedor al terminar — no acumula basura.
      # -e CI=true pasa la variable de entorno al contenedor para que
      # playwright.config.ts aplique la configuración de CI:
      #   - retries: 2
      #   - workers: 1
      #   - forbidOnly: true
      # --project filtra la ejecución al browser de esta VM.
      # ----------------------------------------------------------
      - name: Run E2E tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -e CI=true \
            -e BASE_URL=${{ vars.BASE_URL }} \
            saucedemo-playwright npx playwright test --project=${{ matrix.browser }}

      # ----------------------------------------------------------
      # PASO 4 — Subir Playwright HTML Report como artifact
      # `if: always()` es crítico: sube el reporte INCLUSO si los
      # tests fallaron. Sin esto, solo tendrías el reporte cuando
      # todo pasa — justo cuando no lo necesitas.
      # El artifact queda disponible en la pestaña "Actions" del
      # repo en GitHub para descargarlo y abrirlo localmente.
      # El nombre incluye el browser para que los 3 no se pisen.
      # retention-days: 5 — GitHub lo borra automáticamente
      # después de 5 días para no consumir storage indefinidamente.
      # ----------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 5

      # ----------------------------------------------------------
      # PASO 5 — Subir allure-results como artifact
      # Cada browser sube sus resultados con un nombre único.
      # El job "report" los descarga todos y los consolida en
      # un único reporte Allure con los 3 browsers.
      # ----------------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 5

  # ------------------------------------------------------------
  # JOB 2 — Consolidar y publicar el reporte Allure.
  # `needs: test` garantiza que este job corre DESPUÉS de que
  # los 3 browsers terminen (fallen o pasen).
  # `if: always()` lo ejecuta incluso si algún browser falló —
  # que es exactamente cuando más se necesita el reporte.
  # ------------------------------------------------------------
  report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------
      # PASO 1 — Clonar el repositorio
      # Necesario para que peaceiris pueda hacer push a gh-pages.
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PASO 2 — Descargar todos los allure-results
      # `pattern: allure-results-*` descarga los 3 artifacts
      # (chromium, firefox, webkit) en una sola carpeta.
      # `merge-multiple: true` los combina en allure-results/
      # en lugar de crear subcarpetas por artifact.
      # ----------------------------------------------------------
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results/

      # ----------------------------------------------------------
      # PASO 3 — Generar Allure Report consolidado
      # Con los resultados de los 3 browsers en allure-results/,
      # genera un único reporte HTML que muestra todo junto.
      # ----------------------------------------------------------
      - name: Setup Node.js for Allure
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Allure CLI
        run: npm install allure-commandline --save-dev

      - name: Generate Allure report
        run: npm run allure:generate

      # ----------------------------------------------------------
      # PASO 4 — Publicar Allure Report en GitHub Pages
      # peaceiris/actions-gh-pages toma la carpeta allure-report/
      # y la despliega en la rama gh-pages del repo.
      # GitHub Pages sirve esa rama como sitio web estático en:
      #   https://<usuario>.github.io/<repo>/
      # GITHUB_TOKEN es un token temporal que GitHub inyecta
      # automáticamente en cada run — no requiere configuración.
      # ----------------------------------------------------------
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report